<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vídeo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #play-btn {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    z-index: 10;
  }
  #play-btn svg {
    width: 88px;
    height: 88px;
  }
</style>
</head>
<body>
  <video id="v" src="https://salutjesuisjess.github.io/audioscotcf/DiaDosPais_Manu.mp4" playsinline controls></video>

  <div id="play-btn">
    <svg viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
      <circle cx="44" cy="44" r="44" fill="rgba(255,255,255,0.9)"/>
      <polygon points="35,26 35,62 64,44" fill="#000"/>
    </svg>
  </div>

  <script>
    const v = document.getElementById('v');
    const btn = document.getElementById('play-btn');

    function startVideo() {
      if (v.requestFullscreen) v.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iOS Safari
      else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();

      v.play();
      btn.style.display = 'none';
    }

    btn.addEventListener('click', startVideo, { once: true });
    btn.addEventListener('touchstart', startVideo, { once: true });
  </script>
</body>
</html>
